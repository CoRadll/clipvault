name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # 项目依赖 Win32 API，必须在 Windows 上构建
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # runner 上装了 VS，但 cl.exe 不在 PATH。
      # 这个 action 相当于在 CI 里执行 vcvars64.bat。
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Run tests
        run: build/debug/clipvault_tests.exe
